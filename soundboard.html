<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080f1b">
  <meta name="description" content="Choose your side. Find your voice. A Chivalry: Medieval Warfare voice-command soundboard.">
  <title>Chivalry · Voice commands</title>
  <link rel="stylesheet" href="soundboard/style.css">
  <script defer src="soundboard/catalog.js"></script>
  <script defer src="soundboard/playback.js"></script>
  <script defer src="soundboard/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="wordmark" href="#" aria-label="Chivalry Voice Commands — choose faction"><span>Chivalry</span><small>Voice commands</small></a>
    <nav class="steps" aria-label="Selection progress">
      <a href="#" data-step="faction">Faction</a><span aria-hidden="true">/</span>
      <a href="#" data-step="class">Class</a><span aria-hidden="true">/</span>
      <a href="#" data-step="voice">Voice commands</a>
    </nav>
    <a class="collection-link" href="index.html">Full collection <span aria-hidden="true">↗</span></a>
  </header>
  <section class="sound-controls" aria-label="Sound controls" hidden>
    <div class="sound-controls-row">
      <button class="icon-button" id="mute" type="button" aria-label="Mute"></button>
      <label class="volume-label"><span class="sr-only">Volume</span><input id="volume" type="range" min="0" max="1" step="0.05" value="0.8"></label>
      <span id="active-count">No voices playing</span>
      <button class="stop-all" type="button" data-action="stop-all" disabled>Stop all</button>
    </div>
    <p class="audio-error" role="alert" hidden></p>
  </section>
  <main id="main" tabindex="-1"></main>
  <noscript><p class="notice">Please enable JavaScript to choose a voice and play recordings. You can also open the <a href="index.html">full collection</a>.</p></noscript>
  <footer class="site-footer"><span>Chivalry: Medieval Warfare</span><span>A fan-made voice collection · <a href="index.html">Browse all recordings</a></span></footer>
  <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
  <div id="picker-shade" class="picker-shade" hidden aria-hidden="true"></div>
  <dialog id="versions" aria-labelledby="versions-title" aria-modal="false">
    <header class="dialog-header"><div><small>Choose a version</small><h2 id="versions-title"></h2></div><button type="button" class="icon-button" data-action="close-versions" aria-label="Close version picker">×</button></header>
    <div id="version-list"></div>
    <p class="dialog-note">Your choice is remembered for this character. Choose Random version to shuffle again.</p>
  </dialog>
</body>
</html>
